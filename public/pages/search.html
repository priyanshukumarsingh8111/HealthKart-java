<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthKart - Medicines</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../css/app.css">
</head><body>
<div id="nav"></div>
<main class="page"><h1>Medicines & Health Products</h1><p class="sub">Search, filter, and add to cart.</p>
<div class="toolbar"><input id="q" placeholder="Search medicines..."><select id="cat"><option value="all">All categories</option></select>
<select id="sort"><option value="">Sort: Relevance</option><option value="price-low">Price: Low to High</option><option value="price-high">Price: High to Low</option><option value="rating">Top rated</option></select></div>
<div id="out" class="grid"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
<script src="../js/common.js"></script>
<script>
HK.nav("search");

const q=document.getElementById('q'),cat=document.getElementById('cat'),sort=document.getElementById('sort'),out=document.getElementById('out');
q.value=new URLSearchParams(location.search).get('q')||'';

async function initCategories() {
  try {
    const r = await HK.api('/medicines');
    if (r && r.medicines && r.medicines.length) {
      const cats = [...new Set(r.medicines.map(m => m.category))];
      cat.innerHTML = '<option value="all">All categories</option>' + cats.map(c => `<option value="${HK.esc(c)}">${HK.esc(c)}</option>`).join('');
    }
  } catch(e) {
    console.warn("Categories initialization notice:", e);
  }
}
initCategories();

let t;
async function load(){
  try {
    const p=new URLSearchParams({search:q.value.trim(),category:cat.value,sort:sort.value});
    const r=await HK.api('/medicines?'+p);
    const cmp=HK.json('hk_compare',[]);
    const list = (r && r.medicines) ? r.medicines : [];
    out.innerHTML=list.length?list.map(m=>`<div class="card">
     <div class="medicine-media">
       ${m.image?`<img src="${HK.img?HK.img(m.image):m.image}" alt="${HK.esc(m.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`:''}
       <div class="media-fallback" style="${m.image?'display:none;':''}"><i class="fa-solid ${HK.esc(m.icon||'fa-pills')}"></i></div>
     </div>
     <span class="tag">${HK.esc(m.category)}</span><h3>${HK.esc(m.name)}</h3><p>${HK.esc(m.description)}</p>
     <div class="price">${HK.rupee(m.price)} <small style="font-size:12px;color:#e8a317">★ ${m.rating}</small></div>
     <div class="row"><button class="btn sm" data-add="${m.id}">Add to cart</button>
     <button class="btn sm ghost" data-cmp="${m.id}">${cmp.includes(m.id)?'In compare':'Compare'}</button></div></div>`).join('')
     :'<div class="empty" style="grid-column:1/-1">No products found.</div>';
    out.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>HK.addToCart(list.find(m=>m.id===b.dataset.add)));
    out.querySelectorAll('[data-cmp]').forEach(b=>b.onclick=()=>{let c=HK.json('hk_compare',[]);
      if(c.includes(b.dataset.cmp))return HK.toast('Already in compare list');
      if(c.length>=3)return HK.toast('You can compare up to 3 products');
      c.push(b.dataset.cmp);HK.save('hk_compare',c);b.textContent='In compare';HK.toast('Added to compare');});
  } catch(err) {
    console.error("Error loading medicines:", err);
    out.innerHTML='<div class="empty" style="grid-column:1/-1">Unable to load medicines. Please ensure the backend server is active at http://localhost:3000.</div>';
  }
}
q.oninput=()=>{clearTimeout(t);t=setTimeout(load,200)};cat.onchange=sort.onchange=load;load();
</script></body></html>
