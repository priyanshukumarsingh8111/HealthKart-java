<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthKart - Video Consultation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../css/app.css">
</head><body>
<div id="nav"></div>
<main class="page"><h1>Video Consultation</h1><p class="sub" id="info">Connecting...</p>
<div class="callbox"><div><div class="videos"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video><div class="cstatus" id="st">Waiting for the other participant...</div></div>
<div class="row" style="margin-top:14px"><button class="btn ghost" id="mic">Mute mic</button><button class="btn ghost" id="cam">Camera off</button><button class="btn ghost" id="scr">Share screen</button><button class="btn red" id="end">End call</button></div></div>
<aside><div class="chat" id="chat" style="height:300px"></div><div class="row" style="margin-top:10px"><input id="ci" placeholder="Message..." style="flex:1;border:1px solid #dfe9e4;border-radius:9px;padding:10px"><button class="btn" id="cs">Send</button></div>
<div id="rxBox" style="margin-top:18px"></div></aside></div></main>
<div class="modal-bg" id="bg"><div class="modal"><h2>Issue prescription</h2>
<div class="field">Diagnosis<input id="dg"></div><div class="field">Medicine<input id="mn"></div>
<div class="row"><div class="field" style="flex:1">Dosage<input id="md"></div><div class="field" style="flex:1">Meal timing<select id="mt"><option>After Breakfast</option><option selected>After Lunch</option><option>After Dinner</option><option>Before Breakfast</option><option>Before Lunch</option><option>Before Dinner</option></select></div></div>
<div class="field">Yoga (optional)<input id="yn"></div><div class="field">Advice<textarea id="ad" rows="2"></textarea></div><div class="err" id="err"></div>
<div class="row"><button class="btn" id="sv">Send prescription</button><button class="btn ghost" id="cl">Close</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
<script src="../js/common.js"></script>
<script>
HK.nav("");

const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);
const apptId=p.get('appointment')||p.get('room')||p.get('id');
let role=p.get('role')==='doctor'?'doctor':'patient';
const u=HK.user()||{name:(role==='doctor'?'Dr. Sharma':'Patient'),email:''};
if(u.role==='doctor')role='doctor';

let roomId,appt,pc,local,offered=false,queue=[],sharing=false;
const addMsg=(c,t,who)=>{$('chat').insertAdjacentHTML('beforeend',`<div class="msg ${c}">${who?'<small>'+HK.esc(who)+'</small><br>':''}${HK.esc(t)}</div>`);$('chat').scrollTop=$('chat').scrollHeight;};
const status=t=>$('st').textContent=t;

async function getMediaStream(){
  try{
    return await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  }catch(e1){
    try{
      return await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    }catch(e2){
      console.warn('Physical camera unavailable, activating simulated HD consultation video feed:',e2);
      status('Consultation Video Active');
      const cvs=document.createElement('canvas');cvs.width=640;cvs.height=480;
      const ctx=cvs.getContext('2d');let tick=0;
      const isDoc=role==='doctor';
      const displayName=u.name||(isDoc?'Doctor':'Patient');
      const inits=displayName.split(' ').map(x=>x[0]).join('').substring(0,2).toUpperCase()||(isDoc?'DR':'PT');

      function loop(){
        tick++;
        const g=ctx.createLinearGradient(0,0,cvs.width,cvs.height);
        if(isDoc){g.addColorStop(0,'#065f46');g.addColorStop(1,'#022c22');}
        else{g.addColorStop(0,'#1e40af');g.addColorStop(1,'#0f172a');}
        ctx.fillStyle=g;ctx.fillRect(0,0,cvs.width,cvs.height);

        const p=Math.sin(tick*0.06)*12;
        ctx.beginPath();ctx.arc(320,190,75+p,0,Math.PI*2);
        ctx.fillStyle=isDoc?'rgba(16,185,129,0.2)':'rgba(59,130,246,0.2)';ctx.fill();

        ctx.beginPath();ctx.arc(320,190,68,0,Math.PI*2);
        ctx.fillStyle='#ffffff';ctx.fill();

        ctx.fillStyle=isDoc?'#0b9f6e':'#1e40af';
        ctx.font='bold 44px Inter, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(inits,320,190);

        ctx.fillStyle='#ffffff';ctx.font='bold 22px Inter, sans-serif';
        ctx.fillText(displayName,320,300);

        ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='14px Inter, sans-serif';
        ctx.fillText(isDoc?'🩺 Clinical Specialist Feed':'👤 Patient Consultation Feed',320,332);

        ctx.fillStyle='rgba(0,0,0,0.4)';
        if(ctx.roundRect)ctx.roundRect(220,370,200,32,16);else ctx.rect(220,370,200,32);
        ctx.fill();

        ctx.fillStyle='#10b981';ctx.beginPath();ctx.arc(242,386,5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffffff';ctx.font='bold 12px Inter, sans-serif';ctx.textAlign='left';
        ctx.fillText('LIVE HD STREAM',256,390);

        requestAnimationFrame(loop);
      }
      loop();

      const simStream=cvs.captureStream(30);
      try{
        const aCtx=new (window.AudioContext||window.webkitAudioContext)();
        const osc=aCtx.createOscillator();
        const dst=aCtx.createMediaStreamDestination();
        const gain=aCtx.createGain();gain.gain.value=0.0001;
        osc.connect(gain);gain.connect(dst);osc.start();
        dst.stream.getAudioTracks().forEach(t=>simStream.addTrack(t));
      }catch(err){}
      return simStream;
    }
  }
}

async function start(){
  try{
    const v=await HK.api('/webrtc/verify-access',{method:'POST',body:{appointmentId:apptId,userEmail:u.email,userRole:role,doctorId:u.doctorId}});
    roomId=v.callRoomId;appt=v.appointment;if(v.role)role=v.role;
    $('info').innerHTML=`<span style="display:inline-flex;align-items:center;gap:10px;"><span class="badge" style="background:#eaf9f3;color:#0b9f6e;">● Active Consultation</span> <b>${role==='doctor'?'Patient: '+(appt.patientName||'Patient'):'Doctor: '+(appt.doctorName||'Doctor')}</b> <span>· ${HK.esc(appt.specialization||'General Consultation')}</span> <span>· ID: ${HK.esc(appt.appointmentId)}</span></span>`;
  }catch(e){
    $('info').textContent=e.message;status('Access denied');return;
  }

  local=await getMediaStream();
  $('localVideo').srcObject=local;
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
  local.getTracks().forEach(t=>pc.addTrack(t,local));
  pc.ontrack=e=>{if(e.streams&&e.streams[0]){$('remoteVideo').srcObject=e.streams[0];status('Connected · Live Consultation');}};
  pc.onicecandidate=e=>{if(e.candidate)HK.socket.emit('ice_candidate',{roomId,candidate:e.candidate});};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected')status('Connected · Live Audio & Video');};

  const s=HK.socket;

  async function createOffer(){
    if(role==='doctor'&&!offered){
      offered=true;status('Connecting to patient...');
      try{
        const o=await pc.createOffer();
        await pc.setLocalDescription(o);
        s.emit('webrtc_offer',{roomId,sdp:pc.localDescription});
      }catch(err){console.error('Offer error:',err);}
    }
  }

  s.on('room_ready',createOffer);
  s.on('peer_joined',d=>{addMsg('bot',d.userName+' joined');if(role==='doctor'&&!offered)createOffer();});
  s.on('webrtc_offer',async({sdp})=>{
    status('Connecting to doctor...');
    try{
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      await flush();
      const a=await pc.createAnswer();
      await pc.setLocalDescription(a);
      s.emit('webrtc_answer',{roomId,sdp:pc.localDescription});
    }catch(err){console.error('Answer error:',err);}
  });
  s.on('webrtc_answer',async({sdp})=>{
    try{
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      await flush();status('Connected · Live Consultation');
    }catch(err){console.error('Remote answer error:',err);}
  });
  s.on('ice_candidate',async({candidate})=>{
    if(candidate){
      if(pc.remoteDescription&&pc.remoteDescription.type){
        pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(()=>{});
      }else{queue.push(candidate);}
    }
  });

  s.on('peer_left',()=>status('The other participant left'));
  s.on('call_ended',()=>{status('Call ended');setTimeout(leave,1200);});
  s.on('in_call_chat',d=>addMsg('bot',d.message,d.senderName));
  s.on('screen_share_status',d=>addMsg('bot',d.userName+(d.isSharing?' started':' stopped')+' sharing screen'));
  s.on('in_call_prescription',({prescription})=>{$('rxBox').innerHTML=`<div class="card"><b>📋 Prescription ${HK.esc(prescription.id)}</b><p>${HK.esc(prescription.diagnosis)}</p><p><a href="${HK.pageUrl('my-health.html')}" style="color:#0b9f6e;font-weight:700">View in My Health</a></p></div>`;HK.toast('New prescription received');});

  const join=()=>s.emit('join_room',{roomId,role,userName:u.name});
  s.connected?join():s.on('connect',join);
  if(role==='doctor'){
    $('rxBox').innerHTML='<button class="btn" id="rxOpen" style="width:100%">Issue prescription</button>';
    $('rxOpen').onclick=()=>$('bg').classList.add('open');
  }
}

async function flush(){
  while(queue.length){
    const c=queue.shift();
    try{await pc.addIceCandidate(new RTCIceCandidate(c));}catch(e){}
  }
}

function leave(){
  local&&local.getTracks().forEach(t=>t.stop());
  location.href=HK.pageUrl(role==='doctor'?'doctor-dashboard.html':'my-health.html');
}

$('end').onclick=()=>{HK.socket.emit('end_call',{roomId});leave();};
$('mic').onclick=e=>{const t=local.getAudioTracks()[0];if(t){t.enabled=!t.enabled;e.target.textContent=t.enabled?'Mute mic':'Unmute mic';e.target.classList.toggle('ghost',t.enabled);e.target.classList.toggle('red',!t.enabled);}};
$('cam').onclick=e=>{const t=local.getVideoTracks()[0];if(t){t.enabled=!t.enabled;e.target.textContent=t.enabled?'Camera off':'Camera on';e.target.classList.toggle('ghost',t.enabled);e.target.classList.toggle('red',!t.enabled);}};
$('scr').onclick=async()=>{
  const snd=pc.getSenders().find(x=>x.track&&x.track.kind==='video');
  if(!sharing){
    try{
      const ss=await navigator.mediaDevices.getDisplayMedia({video:true});
      const tr=ss.getVideoTracks()[0];
      await snd.replaceTrack(tr);sharing=true;
      HK.socket.emit('screen_share_status',{roomId,isSharing:true,userName:u.name});
      tr.onended=()=>stopShare(snd);
    }catch(e){}
  }else stopShare(snd);
};

async function stopShare(snd){
  if(snd&&local.getVideoTracks()[0])await snd.replaceTrack(local.getVideoTracks()[0]);
  sharing=false;
  HK.socket.emit('screen_share_status',{roomId,isSharing:false,userName:u.name});
}

function send(){
  const t=$('ci').value.trim();if(!t)return;$('ci').value='';
  addMsg('me',t);HK.socket.emit('in_call_chat',{roomId,message:t,senderName:u.name,role});
}
$('cs').onclick=send;$('ci').onkeydown=e=>{if(e.key==='Enter')send();};
$('cl').onclick=()=>$('bg').classList.remove('open');

$('sv').onclick=async()=>{
  const dg=$('dg').value.trim();if(!dg)return $('err').textContent='Diagnosis is required.';
  const body={
    appointmentId:appt.appointmentId,
    doctorId:appt.doctorId,
    doctorName:appt.doctorName,
    doctorSpecialization:appt.specialization||'General Physician',
    doctorHospital:appt.clinicHospital||'Max Super Speciality Hospital, New Delhi',
    patientName:appt.patientName,
    patientEmail:appt.patientEmail,
    patientMobile:appt.patientMobile||appt.patientPhone,
    diagnosis:dg,
    advice:$('ad').value.trim(),
    medicines:[],
    yogaRoutines:[]
  };
  if($('mn').value.trim())body.medicines.push({name:$('mn').value.trim(),dosage:$('md').value.trim(),mealTiming:$('mt').value});
  if($('yn').value.trim())body.yogaRoutines.push({poseName:$('yn').value.trim(),duration:'15 Mins',timing:'07:00'});
  try{
    const r=await HK.api('/prescriptions',{method:'POST',body});
    HK.socket.emit('in_call_prescription',{roomId,prescription:r.prescription});
    $('bg').classList.remove('open');
    HK.toast('Prescription sent to patient!');
  }catch(e){$('err').textContent=e.message;}
};

if(!apptId)$('info').textContent='Missing appointment ID.';else start();
</script></body></html>
