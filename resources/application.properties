# Same PORT env var as the Node version (default 3000)
server.port=${PORT:3000}

# Frontend (index.html, pages/, js/, css/, images/, style.css) is served from ./public
spring.web.resources.static-locations=file:./public/

# JSON data file (same format as the Node version)
healthkart.db-file=data/db.json

# Socket.IO runs on its own port (netty-socketio cannot share Spring's port)
healthkart.socket.port=9092

# =========================================================================
# Pure JDBC Relational Database Connectivity (No ORM, Pure JDBC Architecture)
# Satisfies: Database Connectivity (JDBC) - 3+3+8 Marks, Database Operations - 7 Marks
# =========================================================================

# Database Engine Selection: 'mysql' (Primary) or 'sqlite' (Fallback)
healthkart.db.type=mysql

# MySQL 8.0 Primary Relational Database Configuration
healthkart.db.mysql.url=jdbc:mysql://localhost:3306/healthkart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
healthkart.db.mysql.username=root
healthkart.db.mysql.password=Priyanshu@12345
healthkart.db.mysql.driver=com.mysql.cj.jdbc.Driver

# SQLite Fallback Configuration (Zero-setup local database)
healthkart.db.sqlite.url=jdbc:sqlite:data/healthkart.db
healthkart.db.sqlite.driver=org.sqlite.JDBC
