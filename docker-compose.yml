services:
  healthkart-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthkart-server
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9092:9092"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - TZ=Asia/Kolkata
      - JAVA_OPTS=-Xms256m -Xmx512m
      - healthkart.db.type=sqlite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/servlets/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

